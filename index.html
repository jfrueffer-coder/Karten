<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collector Ultimate – Absolute Full Version</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } 
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch, query, orderBy } 
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyD7EPCt5O0_l8rIF8TJJq1UISgfVPncmWQ",
  authDomain:        "karten-96920.firebaseapp.com",
  projectId:         "karten-96920",
  messagingSenderId: "895981550262",
  appId:             "1:895981550262:web:d69cc1e84ab956ca780417"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── STATE ──────────────────────────────────────────────────────
let cards = [], categories = [];
let activeCat = '', editingId = null;
let selectedCards = new Set();
let isSelecting = false, startX = 0, startY = 0;
let collapsedCats = new Set();
let showOnlyMissing = false;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

// ── AUTH LOGIK ────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  const loginScreen = document.getElementById('login-screen');
  const appContainer = document.getElementById('app');
  
  if (user) {
    loginScreen.style.display = 'none';
    appContainer.style.display = 'grid';
    document.getElementById('fb-dot').className = 'fb-dot online';
    subscribeData();
  } else {
    loginScreen.style.display = 'flex';
    appContainer.style.display = 'none';
    document.getElementById('fb-dot').className = 'fb-dot';
  }
});

window.handleLogin = async (e) => {
  e.preventDefault();
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errorEl = document.getElementById('login-error');
  
  if (user.toLowerCase() === "florian") {
    try {
      await signInWithEmailAndPassword(auth, "florian@collector.de", pass);
    } catch (err) {
      errorEl.textContent = "Passwort falsch.";
    }
  } else {
    errorEl.textContent = "Benutzer nicht gefunden.";
  }
};

window.logout = () => signOut(auth);

// ── DATEN-ABO (MIT FIXER SORTIERUNG) ──────────────────────────
function subscribeData() {
  showLoading(true);
  let cardsReady = false, catsReady = false;
  const checkReady = () => { if (cardsReady && catsReady) showLoading(false); };

  // Wichtig: orderBy('pos') stellt sicher, dass die Sortierung nach dem Drop erhalten bleibt
  onSnapshot(query(collection(db, 'cards'), orderBy('pos', 'asc')), snap => {
    cards = snap.docs.map(d => ({id:d.id, ...d.data()}));
    cardsReady = true; checkReady(); renderAll();
  });

  onSnapshot(query(collection(db, 'categories'), orderBy('pos', 'asc')), snap => {
    categories = snap.docs.map(d => d.data());
    catsReady = true; checkReady(); renderAll();
  });
}

function showLoading(on) {
  let el = document.getElementById('loading-overlay');
  if (el) el.style.display = on ? 'flex' : 'none';
}

function renderAll() {
  renderSidebar();
  renderGrid();
  updateStats();
  renderCatDropdowns();
}

function updateStats() {
  const have = cards.filter(c => c.status !== 'missing').length;
  document.getElementById('stat-total').textContent = cards.length;
  document.getElementById('stat-have').textContent = have;
}

// ── SIDEBAR & DRAG-AND-DROP KATEGORIEN ────────────────────────
let draggedCatName = null;
let draggedParent = null;

function renderSidebar() {
  const container = document.getElementById('cat-list');
  container.innerHTML = '';
  
  // Statischer Link: Alle
  container.appendChild(createCatEl({name: '', parent: null}, 'Alle Karten'));

  const parents = categories.filter(c => !c.parent);
  
  parents.forEach(p => {
    const isCollapsed = collapsedCats.has(p.name);
    container.appendChild(createCatEl(p, p.name, false, true, isCollapsed));
    
    if (!isCollapsed) {
      const subs = categories.filter(c => c.parent === p.name);
      subs.forEach(s => {
        container.appendChild(createCatEl(s, s.name, true));
      });
    }
  });
}

function createCatEl(cat, label, isSub = false, hasChildren = false, isCollapsed = false) {
  const rel = cat.name === '' ? cards : cards.filter(c => c.cat === cat.name || (categories.find(x=>x.name===c.cat)?.parent === cat.name));
  const total = rel.length, owned = rel.filter(c => c.status !== 'missing').length;
  const pct = total > 0 ? Math.round((owned / total) * 100) : 0;
  
  const li = document.createElement('li');
  li.className = (activeCat === cat.name ? 'active ' : '') + (isSub ? 'sub-cat' : 'parent-cat');
  li.dataset.name = cat.name;

  if (cat.name !== '') {
    li.draggable = true;
    li.addEventListener('dragstart', e => {
      draggedCatName = cat.name;
      draggedParent = cat.parent || null;
      li.classList.add('is-dragging-item');
    });

    li.addEventListener('dragend', () => {
      li.classList.remove('is-dragging-item');
      document.querySelectorAll('.drop-before, .drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after'));
    });

    li.addEventListener('dragover', e => {
      e.preventDefault();
      if (draggedCatName === cat.name) return;
      if (draggedParent !== (cat.parent || null)) return; // Nur gleiche Ebene sortieren

      const rect = li.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      li.classList.remove('drop-before', 'drop-after');
      if (e.clientY < mid) li.classList.add('drop-before');
      else li.classList.add('drop-after');
    });

    li.addEventListener('drop', async e => {
      e.preventDefault();
      const isBefore = li.classList.contains('drop-before');
      if (!draggedCatName || draggedCatName === cat.name) return;

      let siblings = categories
        .filter(c => (c.parent || null) === (cat.parent || null))
        .sort((a,b) => (a.pos || 0) - (b.pos || 0));

      const fromIdx = siblings.findIndex(s => s.name === draggedCatName);
      const [movedItem] = siblings.splice(fromIdx, 1);
      
      let toIdx = siblings.findIndex(s => s.name === cat.name);
      if (!isBefore) toIdx++;
      siblings.splice(toIdx, 0, movedItem);

      const batch = writeBatch(db);
      siblings.forEach((s, idx) => {
        batch.update(doc(db, 'categories', s.name), { pos: idx });
      });
      await batch.commit();
    });
  }

  let toggle = hasChildren ? `<span class="toggle-icon" onclick="event.stopPropagation(); window.toggleCatCollapse('${cat.name}')">${isCollapsed ? '▶' : '▼'}</span>` : '';
  let dragHandle = cat.name !== '' ? `<span class="cat-drag-handle">⠿</span>` : '';
  let renameBtn = cat.name !== '' ? `<span class="cat-rename" onclick="event.stopPropagation(); window.renameCategory('${cat.name}')">✏️</span>` : '';
  let deleteBtn = (cat.name !== '' && total === 0) ? `<span class="cat-delete" onclick="event.stopPropagation(); window.removeCategory('${cat.name}')">×</span>` : '';

  li.onclick = () => { activeCat = cat.name; renderGrid(); renderSidebar(); };
  
  li.innerHTML = `
    <div class="per-bg" style="width:${pct}%"></div>
    <div class="cat-content">
        ${dragHandle}
        ${toggle}
        <span class="cat-label">${label}</span>
        <span class="cat-stats">${owned}/${total}</span>
        <div class="cat-actions">${renameBtn}${deleteBtn}</div>
    </div>
  `;
  return li;
}

window.toggleCatCollapse = (name) => {
  collapsedCats.has(name) ? collapsedCats.delete(name) : collapsedCats.add(name);
  renderSidebar();
};

window.removeCategory = async (name) => {
  if (!confirm(`Kategorie "${name}" wirklich löschen?`)) return;
  await deleteDoc(doc(db, 'categories', name));
  if (activeCat === name) activeCat = '';
};

window.renameCategory = async (oldName) => {
  const newName = prompt(`Kategorie umbenennen:`, oldName);
  if (!newName || newName.trim() === '' || newName.trim() === oldName) return;
  const trimmed = newName.trim();
  if (categories.find(c => c.name === trimmed)) { alert('Name existiert schon.'); return; }

  const oldCat = categories.find(c => c.name === oldName);
  const batch = writeBatch(db);
  batch.set(doc(db, 'categories', trimmed), { ...oldCat, name: trimmed });
  batch.delete(doc(db, 'categories', oldName));
  cards.filter(c => c.cat === oldName).forEach(c => batch.update(doc(db, 'cards', c.id), { cat: trimmed }));
  categories.filter(c => c.parent === oldName).forEach(c => batch.update(doc(db, 'categories', c.name), { parent: trimmed }));
  await batch.commit();
  if (activeCat === oldName) activeCat = trimmed;
};

// ── GRID & KARTEN RENDERING ───────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  
  const search = document.getElementById('search-input').value.toLowerCase();
  const filtered = cards.filter(c => {
    const matchesCat = !activeCat || c.cat === activeCat || (categories.find(x=>x.name===c.cat)?.parent === activeCat);
    const matchesMissing = !showOnlyMissing || c.status === 'missing';
    const matchesSearch = !search || (c.name && c.name.toLowerCase().includes(search));
    return matchesCat && matchesMissing && matchesSearch;
  });

  filtered.forEach(c => {
    const div = document.createElement('div');
    const opacityClass = (c.status === 'missing' && !showOnlyMissing) ? 'is-missing' : '';
    div.className = `card-item ${opacityClass} ${selectedCards.has(c.id) ? 'selected' : ''}`;
    div.dataset.id = c.id;
    div.draggable = true;
    div.innerHTML = `
      <div class="card-img-wrap">${c.image
        ? `<img data-src="${c.image}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" loading="lazy" class="lazy-img">`
        : '<span>🃏</span>'}</div>
      ${c.status === 'missing' ? '<div class="badge">FEHLT</div>' : ''}
      <div class="card-info">${c.name || ''}</div>
    `;
    div.ondblclick = () => window.openEditModal(c);
    div.onclick = (e) => {
        if (selectedCards.has(c.id)) selectedCards.delete(c.id);
        else selectedCards.add(c.id);
        updateBulkUI();
        div.classList.toggle('selected');
    };
    div.ondragstart = (e) => { e.dataTransfer.setData('card-id', c.id); div.classList.add('dragging'); };
    div.ondragend = () => div.classList.remove('dragging');
    div.ondragover = (e) => e.preventDefault();
    div.ondrop = (e) => { e.stopPropagation(); handleSortDrop(e, c.id); };
    grid.appendChild(div);
  });
  initLazyImages();
}

function initLazyImages() {
  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        img.src = img.dataset.src;
        img.classList.remove('lazy-img');
        obs.unobserve(img);
      }
    });
  }, { rootMargin: '100px' });
  document.querySelectorAll('img.lazy-img').forEach(img => observer.observe(img));
}

window.toggleMissingFilter = () => {
  showOnlyMissing = !showOnlyMissing;
  const btn = document.getElementById('btn-toggle-missing');
  btn.classList.toggle('active');
  btn.textContent = showOnlyMissing ? 'ALLE ANZEIGEN' : 'NUR FEHLENDE';
  renderGrid();
};

// ── DRAG & DROP BILDER ────────────────────────────────────────
async function processImageFile(file) {
  return new Promise((resolve) => {
    const rd = new FileReader();
    rd.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 400;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h *= MAX / w; w = MAX; }
          else { w *= MAX / h; h = MAX; }
        }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/webp', 0.65));
      };
      img.src = ev.target.result;
    };
    rd.readAsDataURL(file);
  });
}

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => {
  if (e.dataTransfer.getData('card-id') || draggedCatName) return;
  e.preventDefault();
  
  const files = Array.from(e.dataTransfer.files);
  const html = e.dataTransfer.getData('text/html');
  let newUrls = [];

  if (files.length > 0) {
    for (let file of files) {
      if (file.type.startsWith('image/')) {
        const base64 = await processImageFile(file);
        newUrls.push(base64);
      }
    }
  } else if (html) {
    const parser = new DOMParser();
    const docParsed = parser.parseFromString(html, "text/html");
    newUrls = Array.from(docParsed.querySelectorAll('img')).map(img => img.src).filter(src => src);
  }

  if (newUrls.length > 0) {
    const batch = writeBatch(db);
    newUrls.forEach((url, i) => {
      const id = uid();
      batch.set(doc(db, 'cards', id), { id, image: url, status: 'have', cat: activeCat, name: '', pos: Date.now() + i });
    });
    await batch.commit();
  }
});

async function handleSortDrop(e, targetId) {
  const draggedId = e.dataTransfer.getData('card-id');
  if (!draggedId || draggedId === targetId) return;
  const tIdx = cards.findIndex(c => c.id === targetId);
  await updateDoc(doc(db, 'cards', draggedId), { pos: cards[tIdx].pos - 0.1 });
}

// ── AUSWAHLRAHMEN & BULK ──────────────────────────────────────
window.addEventListener('mousedown', e => {
  if (e.target.closest('#login-screen') || e.target.closest('.toolbar, .sidebar, .overlay, .card-item, #bulk-bar')) return;
  isSelecting = true;
  startX = e.pageX; startY = e.pageY;
  selectedCards.clear();
  const sb = document.getElementById('selection-box');
  sb.style.display = 'block'; sb.style.width = '0px'; sb.style.height = '0px';
  renderGrid();
});

window.addEventListener('mousemove', e => {
  if (!isSelecting) return;
  const sb = document.getElementById('selection-box');
  const x = Math.min(e.pageX, startX), y = Math.min(e.pageY, startY);
  const w = Math.abs(e.pageX - startX), h = Math.abs(e.pageY - startY);
  sb.style.left = x+'px'; sb.style.top = y+'px'; sb.style.width = w+'px'; sb.style.height = h+'px';
  
  const rect = sb.getBoundingClientRect();
  document.querySelectorAll('.card-item').forEach(el => {
    const r = el.getBoundingClientRect();
    const isOver = !(r.right < rect.left || r.left > rect.right || r.bottom < rect.top || r.top > rect.bottom);
    if(isOver) {
        selectedCards.add(el.dataset.id);
        el.classList.add('selected');
    } else {
        selectedCards.delete(el.dataset.id);
        el.classList.remove('selected');
    }
  });
  updateBulkUI();
});

window.addEventListener('mouseup', () => { 
  if(isSelecting) { isSelecting = false; document.getElementById('selection-box').style.display = 'none'; } 
});

function updateBulkUI() {
  const bar = document.getElementById('bulk-bar');
  if (selectedCards.size > 0) {
    bar.style.display = 'flex';
    document.getElementById('bulk-count').textContent = `${selectedCards.size} markiert`;
  } else { bar.style.display = 'none'; }
}

window.bulkStatus = async (status) => {
  const batch = writeBatch(db);
  selectedCards.forEach(id => batch.update(doc(db, 'cards', id), { status }));
  await batch.commit();
  selectedCards.clear(); updateBulkUI();
};

window.bulkDelete = async () => {
  if (!confirm('Markierte Karten löschen?')) return;
  const batch = writeBatch(db);
  selectedCards.forEach(id => batch.delete(doc(db, 'cards', id)));
  await batch.commit();
  selectedCards.clear(); updateBulkUI();
};

// ── MODALS & KATEGORIE-STEUERUNG ─────────────────────────────
window.addCategory = async () => {
  const n = document.getElementById('new-cat-name').value.trim();
  const p = document.getElementById('new-cat-parent').value;
  if (n) {
      const siblings = categories.filter(c => (c.parent || null) === (p || null));
      await setDoc(doc(db, 'categories', n), { name: n, parent: p || null, pos: siblings.length });
  }
  document.getElementById('new-cat-name').value = '';
};

function renderCatDropdowns() {
  const parents = `<option value="">Keine Überkategorie</option>` + categories.filter(c=>!c.parent).map(c => `<option value="${c.name}">${c.name}</option>`).join('');
  document.getElementById('new-cat-parent').innerHTML = parents;
  document.getElementById('f-cat').innerHTML = `<option value="">Keine</option>` + categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
}

window.openEditModal = (card) => {
  editingId = card.id;
  document.getElementById('f-name').value = card.name || '';
  document.getElementById('f-set').value = card.set || '';
  document.getElementById('f-cat').value = card.cat || '';
  document.getElementById('f-status').value = card.status || 'have';
  document.getElementById('modal-overlay').classList.add('open');
};

window.saveCard = async () => {
  await updateDoc(doc(db, 'cards', editingId), {
    name: document.getElementById('f-name').value, 
    set: document.getElementById('f-set').value,
    cat: document.getElementById('f-cat').value, 
    status: document.getElementById('f-status').value
  });
  document.getElementById('modal-overlay').classList.remove('open');
};

window.setCols = (c) => {
  const g = document.getElementById('card-grid');
  g.style.gridTemplateColumns = (c === 'auto') ? 'repeat(auto-fill, minmax(140px, 1fr))' : `repeat(${c}, 1fr)`;
};
</script>

<style>
:root { 
    --bg: #0a0a0c; 
    --surf: #121216; 
    --border: #22222a; 
    --gold: #f1d382; 
    --text: #e0e0e0; 
    --accent: #1a1a20;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Crimson Pro', serif; overflow: hidden; }

/* LOGIN */
#login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.login-card { background: var(--surf); border: 1px solid var(--border); padding: 3rem; border-radius: 20px; width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.login-card h1 { font-family: 'Cinzel'; color: var(--gold); margin-bottom: 2rem; font-size: 1.5rem; }
.login-card input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: white; padding: 12px; margin-bottom: 1rem; border-radius: 8px; outline: none; }

/* LAYOUT */
#app { display: none; grid-template-rows: 60px 60px 1fr; height: 100vh; }
header { background: var(--surf); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 2rem; gap: 1rem; }
.logo { font-family: 'Cinzel'; font-weight: 900; color: var(--gold); letter-spacing: 2px; font-size: 1.2rem; }
.toolbar { background: var(--accent); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 2rem; gap: 1.5rem; }
.main { display: flex; overflow: hidden; }

/* SIDEBAR & KATEGORIEN */
.sidebar { width: 320px; background: var(--surf); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.cat-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; }

.cat-list li { 
    position: relative;
    background: #1a1a22;
    border: 1px solid var(--border);
    margin-bottom: 5px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
    overflow: hidden;
}

.cat-list li.sub-cat { margin-left: 20px; background: #14141a; scale: 0.98; }
.cat-list li.active { border-color: var(--gold); background: #1e1e28; }

/* DRAG FEEDBACK */
.is-dragging-item { opacity: 0.3; filter: grayscale(1); }
.drop-before { border-top: 2px solid var(--gold) !important; }
.drop-after { border-bottom: 2px solid var(--gold) !important; }

.cat-content { display: flex; align-items: center; padding: 10px; gap: 10px; position: relative; z-index: 2; }

.cat-drag-handle:hover { opacity: 1; }

.cat-actions { display: none; gap: 8px; }
.cat-list li:hover .cat-actions { display: flex; }

.per-bg { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(241, 211, 130, 0.05); z-index: 1; pointer-events: none; }

/* GRID & KARTEN */
.grid-container { flex: 1; padding: 2rem; overflow-y: auto; background: #08080a; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1.5rem; }
.card-item { background: #000; border: 1px solid var(--border); aspect-ratio: 63/88; border-radius: 8px; overflow: hidden; position: relative; transition: 0.2s; cursor: pointer; }
.card-item:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
.card-item.selected { border-color: var(--gold); box-shadow: 0 0 15px rgba(241, 211, 130, 0.3); }
.card-item.is-missing { opacity: 0.25; filter: grayscale(1); }
.card-img-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.card-info { position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 15px 5px 8px; font-size: 0.7rem; text-align: center; }
.badge { position: absolute; top: 8px; left: 8px; background: #ff4d4d; color: white; font-size: 0.6rem; padding: 3px 6px; border-radius: 4px; font-family: 'Cinzel'; }

/* OVERLAYS & BULK */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 5000; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.modal { background: var(--surf); border: 1px solid var(--border); padding: 2rem; border-radius: 15px; width: 400px; display: flex; flex-direction: column; gap: 1rem; }
.btn-gold { background: var(--gold); color: black; border: none; padding: 12px; border-radius: 8px; font-family: 'Cinzel'; font-weight: 900; cursor: pointer; transition: 0.2s; }
.btn-gold:hover { opacity: 0.8; transform: scale(0.98); }

#selection-box { position: absolute; background: rgba(241, 211, 130, 0.1); border: 1px solid var(--gold); pointer-events: none; display: none; z-index: 1000; }
#bulk-bar { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--gold); color: black; padding: 15px 30px; border-radius: 50px; display: none; gap: 20px; align-items: center; z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="login-screen">
    <form class="login-card" onsubmit="window.handleLogin(event)">
        <h1>Collector Login</h1>
        <input type="text" id="login-user" placeholder="Benutzername" required>
        <input type="password" id="login-pass" placeholder="Passwort" required>
        <div id="login-error" style="color:#ff4d4d; font-size:0.8rem; margin-bottom:1rem;"></div>
        <button type="submit" class="btn-gold" style="width:100%">EINLOGGEN</button>
    </form>
</div>

<div id="selection-box"></div>

<div id="loading-overlay" style="display:none;position:fixed;inset:0;background:rgba(10,10,12,0.9);z-index:8000;align-items:center;justify-content:center;flex-direction:column;gap:1rem;font-family:'Cinzel';color:#f1d382;">
  <div style="width:40px;height:40px;border:3px solid #333;border-top-color:#f1d382;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
  LADEN…
</div>

<div id="bulk-bar">
    <span id="bulk-count" style="font-weight:900;">0 markiert</span>
    <button class="btn-gold" style="padding: 5px 15px; font-size:0.7rem;" onclick="window.bulkStatus('have')">BESITZ</button>
    <button class="btn-gold" style="padding: 5px 15px; font-size:0.7rem;" onclick="window.bulkStatus('missing')">FEHLT</button>
    <button class="btn-gold" style="background:#800; color:white; padding: 5px 15px; font-size:0.7rem;" onclick="window.bulkDelete()">LÖSCHEN</button>
</div>

<div id="app">
  <header>
      <div class="logo">⬡ COLLECTOR ULTIMATE</div>
      <div id="fb-dot" class="fb-dot" style="width:10px;height:10px;border-radius:50%;background:#333;"></div>
      <button onclick="window.logout()" style="background:transparent; border:1px solid #333; color:#eee; padding:4px 10px; cursor:pointer; font-size:0.7rem; border-radius:4px;">LOGOUT</button>
      <div style="margin-left:auto; font-family:'Cinzel'; color: var(--gold); font-size:0.8rem;">
          TOTAL: <span id="stat-total">0</span> | OWNED: <span id="stat-have">0</span>
      </div>
  </header>

  <div class="toolbar">
      <input type="text" id="search-input" placeholder="Suchen..." oninput="renderGrid()" style="background:#000; border:1px solid #333; color:#fff; padding:8px; border-radius:5px; width:250px;">
      <button id="btn-toggle-missing" class="btn-gold" style="padding:8px 15px; font-size:0.7rem;" onclick="window.toggleMissingFilter()">ALLE ANZEIGEN</button>
      <select onchange="window.setCols(this.value)" style="background:#000; color:#fff; padding:8px; border-radius:5px; border:1px solid #333;">
          <option value="auto">Auto Grid</option>
          <option value="4">4 Spalten</option>
          <option value="6">6 Spalten</option>
          <option value="8">8 Spalten</option>
          <option value="10">10 Spalten</option>
      </select>
  </div>

  <div class="main">
    <aside class="sidebar">
        <ul class="cat-list" id="cat-list"></ul>
        <div style="padding:20px; border-top:1px solid var(--border); background:rgba(0,0,0,0.3);">
            <input type="text" id="new-cat-name" placeholder="Neue Kategorie..." style="width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #333; color:#fff; border-radius:5px;">
            <select id="new-cat-parent" style="width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #333; color:#fff; border-radius:5px;"></select>
            <button class="btn-gold" style="width:100%" onclick="window.addCategory()">ERSTELLEN</button>
        </div>
    </aside>
    <div class="grid-container">
        <div class="grid" id="card-grid"></div>
    </div>
  </div>
</div>

<div class="overlay" id="modal-overlay">
    <div class="modal">
        <h3 style="font-family:'Cinzel'; color:var(--gold);">Karte Editieren</h3>
        <input type="text" id="f-name" placeholder="Name" style="padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:5px;">
        <input type="text" id="f-set" placeholder="Set / Details" style="padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:5px;">
        <select id="f-cat" style="padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:5px;"></select>
        <select id="f-status" style="padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:5px;">
            <option value="have">Besitz</option>
            <option value="missing">Fehlt</option>
        </select>
        <button class="btn-gold" onclick="window.saveCard()">SPEICHERN</button>
        <button class="btn-gold" style="background:#222; color:#fff" onclick="document.getElementById('modal-overlay').classList.remove('open')">ABBRECHEN</button>
    </div>
</div>
</body>
</html>
