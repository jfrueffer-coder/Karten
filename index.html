const firebaseConfig = {
  apiKey:            "AIzaSyD7EPCt5O0_l8rIF8TJJq1UISgfVPncmWQ",
  authDomain:        "karten-96920.firebaseapp.com",
  projectId:         "karten-96920",
  messagingSenderId: "895981550262",
  appId:             "1:895981550262:web:d69cc1e84ab956ca780417"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── STATE ──────────────────────────────────────────────────────
let cards =[], categories =[];
let activeCat = '', editingId = null;
let selectedCards = new Set();
let isSelecting = false, startX = 0, startY = 0;
let collapsedCats = new Set();
let showOnlyMissing = false;

window.sortableInstances =[];
window.isDraggingCategory = false;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

// ── AUTH ───────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  const loginScreen = document.getElementById('login-screen');
  const appContainer = document.getElementById('app');
  
  if (user) {
    loginScreen.style.opacity = '0';

    subscribeData();
  } else {
    loginScreen.style.display = 'flex';
    setTimeout(() => { loginScreen.style.opacity = '1'; }, 10);
    appContainer.style.display = 'none';
    document.getElementById('fb-dot').className = 'fb-dot';
  }
});

window.logout = () => signOut(auth);

window.renderGrid         = () => renderGrid();
window.toggleMissingFilter = () => _toggleMissingFilter();
window.setCols            = (c) => _setCols(c);
window.addCategory        = () => _addCategory();
window.saveCard           = () => _saveCard();
window.removeCategory     = (n) => _removeCategory(n);
window.renameCategory     = (n) => _renameCategory(n);
window.bulkStatus         = (s) => _bulkStatus(s);

window.openEditModal      = (c) => _openEditModal(c);

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('login-form');
  if (form) form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const userVal  = document.getElementById('login-user').value.trim();

    const errorEl  = document.getElementById('login-error');
    const btn      = document.getElementById('login-btn');

    btn.disabled = true; btn.textContent = 'Lädt...';

    if (userVal.toLowerCase() === 'florian') {

        await signInWithEmailAndPassword(auth, 'florian@collector.de', passVal);

      }
    } else {
      errorEl.textContent = 'Benutzer nicht gefunden.';

function subscribeData() {
  showLoading(true);
  let cardsReady = false, catsReady = false;
  const checkReady = () => { if (cardsReady && catsReady) showLoading(false); };

  onSnapshot(
    query(collection(db, 'cards'), orderBy('pos', 'asc')),
    snap => {
      cards = snap.docs.map(d => ({id:d.id, ...d.data()}));
      cardsReady = true; checkReady(); renderAll();
    },
    err => {
      console.error('Cards snapshot error:', err);
      showLoading(false);
      onSnapshot(collection(db, 'cards'), snap => {
        cards = snap.docs.map(d => ({id:d.id, ...d.data()}));
        cardsReady = true; checkReady(); renderAll();
      });
    }
  );

  onSnapshot(
    collection(db, 'categories'),
    snap => {
      categories = snap.docs.map(d => d.data());
      catsReady = true; checkReady(); renderAll();
    },
    err => { console.error('Categories error:', err); showLoading(false); }
  );
}

function showLoading(on) {
  let el = document.getElementById('loading-overlay');
  if (!el) return;
  el.style.display = on ? 'flex' : 'none';
}

let _renderTimer = null;
function renderAll() {
  if (window.isDraggingCategory) return; // UI nicht neuladen, wenn gerade gezogen wird
  if (_renderTimer) clearTimeout(_renderTimer);
  _renderTimer = setTimeout(() => {
    _renderTimer = null;
    renderSidebar();
    renderGrid();
    updateStats();
    renderCatDropdowns();
  }, 40);
}

function updateStats() {
  const have = cards.filter(c => c.status !== 'missing').length;
  document.getElementById('stat-total').textContent = cards.length;
  document.getElementById('stat-have').textContent = have;
}

window.toggleCatCollapse = (name) => {
  const wrapper = document.getElementById(`sub-wrap-${name}`);
  const icon = document.getElementById(`toggle-icon-${name}`);
  
  if (collapsedCats.has(name)) {
    collapsedCats.delete(name);
    if (wrapper) wrapper.classList.remove('collapsed');
    if (icon) icon.classList.remove('rotated');
  } else {
    collapsedCats.add(name);
    if (wrapper) wrapper.classList.add('collapsed');
    if (icon) icon.classList.add('rotated');
  }
};

// ── NEUE SIDEBAR LOGIK & SORTABLE.JS ───────────────────────────
function renderSidebar() {
  window.sortableInstances.forEach(s => s.destroy());
  window.sortableInstances =[];

  const container = document.getElementById('cat-list');
  container.innerHTML = '';

  const allCardsWrapper = document.createElement('div');
  const allRel = cards;
  const allOwned = allRel.filter(c => c.status !== 'missing').length;
  const allPct = allRel.length > 0 ? Math.round((allOwned / allRel.length) * 100) : 0;
  
  const allContent = document.createElement('div');
  allContent.className = 'cat-content ' + (activeCat === '' ? 'active' : '');
  allContent.innerHTML = `
    <div class="per-bg" style="width:${allPct}%"></div>
    <span class="cat-label" style="padding-left:10px;">Alle Karten</span>
    <span class="cat-stats">${allOwned} / ${allRel.length} <span class="pct">${allPct}%</span></span>
  `;
  allContent.onclick = () => { activeCat = ''; renderGrid(); renderSidebar(); };
  allCardsWrapper.appendChild(allContent);
  container.appendChild(allCardsWrapper);

  const mainContainer = document.createElement('div');
  mainContainer.id = 'main-cats-container';
  mainContainer.dataset.parent = '';
  container.appendChild(mainContainer);

  const parents = categories.filter(c => !c.parent).sort((a,b) => (a.pos||0) - (b.pos||0));
  parents.forEach(p => {
    mainContainer.appendChild(createCatWrapper(p, false));
  });

  initSortable(mainContainer);
  document.querySelectorAll('.sub-cat-list').forEach(subList => initSortable(subList));
}

function initSortable(el) {
  window.sortableInstances.push(new Sortable(el, {
    group: 'categories', // EINE Gruppe für alle (Main & Sub), ermöglicht Level-Crossing
    handle: '.cat-drag-handle',
    animation: 250,
    easing: "cubic-bezier(0.4, 0, 0.2, 1)",
    ghostClass: 'sortable-ghost',
    dragClass: 'sortable-drag',
    fallbackOnBody: true,
    swapThreshold: 0.65,
    onStart: () => { window.isDraggingCategory = true; },
    onMove: (evt) => {
        // Verhindere, dass eine Kategorie MIT eigenen Unterkategorien in eine andere Kategorie gezogen wird
        const draggedName = evt.dragged.dataset.catName;
        const hasChildren = categories.some(c => c.parent === draggedName);
        const isTargetSub = evt.to.classList.contains('sub-cat-list');
        if (hasChildren && isTargetSub) return false;
    },
    onEnd: async (evt) => {
      window.isDraggingCategory = false;
      if (evt.from === evt.to && evt.oldIndex === evt.newIndex) return; // Nichts passiert
      
      const newParent = evt.to.dataset.parent || null;
      const items = Array.from(evt.to.children);
      const batch = writeBatch(db);
      
      items.forEach((el, index) => {
         const name = el.dataset.catName;
         if (name === evt.item.dataset.catName) {
             batch.update(doc(db, 'categories', name), { pos: (index + 1) * 1000, parent: newParent });
         } else {
             batch.update(doc(db, 'categories', name), { pos: (index + 1) * 1000 });
         }
      });
      await batch.commit();
      renderAll(); // Forciert einen UI Refresh nach dem Drop
    }
  }));
}

function createCatWrapper(cat, isSub = false) {
  const rel = cards.filter(c => c.cat === cat.name || (!isSub && categories.find(x=>x.name===c.cat)?.parent === cat.name));
  const total = rel.length;
  const owned = rel.filter(c => c.status !== 'missing').length;
  const pct = total > 0 ? Math.round((owned / total) * 100) : 0;
  
  const wrapper = document.createElement('div');
  wrapper.className = 'cat-wrapper';
  wrapper.dataset.catName = cat.name;

  const content = document.createElement('div');
  content.className = 'cat-content ' + (activeCat === cat.name ? 'active ' : '') + (isSub ? 'sub-cat' : '');

  const children = categories.filter(c => c.parent === cat.name).sort((a,b) => (a.pos||0) - (b.pos||0));
  const hasChildren = children.length > 0;
  
  // Wenn sie leer ist, erzwingen wir, dass sie NICHT eingeklappt ist (damit man droppen kann)
  const isCollapsed = hasChildren && collapsedCats.has(cat.name);

  // Überprüfen, ob Kategorie wirklich 100% leer ist
  const hasCards = cards.some(c => c.cat === cat.name);
  const isEmpty = !hasChildren && !hasCards;

  const iconChevron = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
  const iconDrag = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>`;
  const iconEdit = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
  const iconTrash = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;

  // Toggle Icon nur anzeigen, wenn es Kinder gibt
  let toggle = hasChildren ? `<span class="toggle-icon ${isCollapsed ? 'rotated' : ''}" id="toggle-icon-${cat.name}" onclick="event.stopPropagation(); toggleCatCollapse('${cat.name}')">${iconChevron}</span>` : `<span class="toggle-icon empty"></span>`;
  
  let dragHandle = `<span class="cat-drag-handle" title="Sortieren">${iconDrag}</span>`;
  let renameBtn = `<span class="cat-action cat-rename" onclick="event.stopPropagation(); renameCategory('${cat.name}')" title="Umbenennen">${iconEdit}</span>`;
  
  // Delete Button nur wenn WIRKLICH komplett leer
  let deleteBtn = isEmpty ? `<span class="cat-action cat-delete" onclick="event.stopPropagation(); removeCategory('${cat.name}')" title="Löschen">${iconTrash}</span>` : '';

  content.innerHTML = `
    <div class="per-bg" style="width:${pct}%"></div>
    ${dragHandle}
    ${!isSub ? toggle : ''}
    <span class="cat-label">${cat.name}</span>
    <span class="cat-stats">${owned} / ${total} <span class="pct">${pct}%</span></span>
    <div class="cat-actions">
        ${renameBtn}
        ${deleteBtn}
    </div>
  `;

  content.onclick = (e) => {
    if (e.target.closest('.cat-drag-handle, .cat-action, .toggle-icon')) return;
    activeCat = cat.name; 
    renderGrid(); 
    renderSidebar();
  };

  wrapper.appendChild(content);

  // Immer Sub-Wrapper generieren (damit man Items hineindroppen kann), außer bei Subs
  if (!isSub) {
    const subWrapper = document.createElement('div');
    subWrapper.className = `sub-cat-wrapper ${isCollapsed ? 'collapsed' : ''}`;
    subWrapper.id = `sub-wrap-${cat.name}`;

    const subInner = document.createElement('div');
    subInner.className = 'sub-cat-wrapper-inner';

    const subList = document.createElement('div');
    subList.className = 'sub-cat-list';
    subList.dataset.parent = cat.name;

    children.forEach(sub => {
      subList.appendChild(createCatWrapper(sub, true));
    });
    
    subInner.appendChild(subList);
    subWrapper.appendChild(subInner);
    wrapper.appendChild(subWrapper);
  }

  return wrapper;
}

// ── KATEGORIEN CRUD (ROBUST) ──────────────────────────────────
async function _addCategory() {
  const inputEl = document.getElementById('new-cat-name');
  const parentEl = document.getElementById('new-cat-parent');
  
  // Bereinige Name (Slashes entfernen, da sie Firestore Pfade zerstören)
  const n = inputEl.value.trim().replace(/\//g, '-');
  const p = parentEl.value;
  
  if (!n) return;
  if (categories.find(c => c.name.toLowerCase() === n.toLowerCase())) {
     alert('Eine Kategorie mit diesem Namen existiert bereits!');
     return;
  }
  
  // Finde die maximale Position für das korrekte Einreihen
  const siblings = categories.filter(c => (c.parent || null) === (p || null));
  const maxPos = siblings.reduce((max, c) => Math.max(max, c.pos || 0), 0);
  const newPos = maxPos + 1000;

  await setDoc(doc(db, 'categories', n), { name: n, parent: p || null, pos: newPos });
  inputEl.value = '';
}

async function _removeCategory(name) {
  // Hard-Check Backendseitig zur Sicherheit
  const children = categories.filter(c => c.parent === name);
  if (children.length > 0) return alert('Kategorie kann nicht gelöscht werden: Sie enthält noch Unterkategorien!');
  
  const hasCards = cards.some(c => c.cat === name);
  if (hasCards) return alert('Kategorie kann nicht gelöscht werden: Es sind noch Karten zugewiesen!');

  if (!confirm(`Kategorie "${name}" wirklich löschen?`)) return;
  
  await deleteDoc(doc(db, 'categories', name));
  if (activeCat === name) activeCat = '';
  renderAll();
}

async function _renameCategory(oldName) {
  const newName = prompt(`Kategorie "${oldName}" umbenennen in:`, oldName);
  if (!newName || newName.trim() === '' || newName.trim() === oldName) return;
  
  const trimmed = newName.trim().replace(/\//g, '-');
  if (categories.find(c => c.name.toLowerCase() === trimmed.toLowerCase())) { 
      alert('Dieser Name ist bereits vergeben.'); 
      return; 
  }
  
  const oldCat = categories.find(c => c.name === oldName);
  const batch = writeBatch(db);
  
  // 1. Neue Kategorie setzen
  batch.set(doc(db, 'categories', trimmed), { ...oldCat, name: trimmed });
  // 2. Alte Kategorie löschen
  batch.delete(doc(db, 'categories', oldName));
  
  // 3. Karten updaten
  cards.filter(c => c.cat === oldName).forEach(c => {
      batch.update(doc(db, 'cards', c.id), { cat: trimmed });
  });
  
  // 4. Unterkategorien updaten (falls oldName ein Parent war)
  categories.filter(c => c.parent === oldName).forEach(c => {
      batch.update(doc(db, 'categories', c.name), { parent: trimmed });
  });
  
  await batch.commit();
  if (activeCat === oldName) activeCat = trimmed;
}

function renderCatDropdowns() {
  const parents = `<option value="">Keine Überkategorie</option>` + categories.filter(c=>!c.parent).map(c => `<option value="${c.name}">${c.name}</option>`).join('');
  document.getElementById('new-cat-parent').innerHTML = parents;
  document.getElementById('f-cat').innerHTML = `<option value="">Keine</option>` + categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
}

// ── GRID RENDERING ─────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  
  const filtered = cards.filter(c => {
    const matchesCat = !activeCat || c.cat === activeCat || (categories.find(x=>x.name===c.cat)?.parent === activeCat);
    const matchesMissing = !showOnlyMissing || c.status === 'missing';
    const search = document.getElementById('search-input').value.toLowerCase();
    return matchesCat && matchesMissing && (!search || c.name?.toLowerCase().includes(search));
  });

  filtered.forEach(c => {
    const div = document.createElement('div');
    const opacityClass = (c.status === 'missing' && !showOnlyMissing) ? 'is-missing' : '';
    div.className = `card-item ${opacityClass} ${selectedCards.has(c.id) ? 'selected' : ''}`;
    div.dataset.id = c.id;
    div.draggable = true;
    div.innerHTML = `
      <div class="card-img-wrap">${c.image
        ? `<img data-src="${c.image}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" loading="lazy" decoding="async" class="lazy-img">`
        : '<span>🃏</span>'}</div>
      ${c.status === 'missing' ? '<div class="badge">Fehlt</div>' : ''}
      <div class="card-info"><span class="card-title">${c.name || 'Ohne Titel'}</span></div>
    `;
    div.ondblclick = () => {
      if (div._clickTimer) { clearTimeout(div._clickTimer); div._clickTimer = null; }
      openEditModal(c);
    };
    div.onclick = () => {
      if (div._clickTimer) { clearTimeout(div._clickTimer); div._clickTimer = null; }
      div._clickTimer = setTimeout(() => {
        div._clickTimer = null;
        if (selectedCards.has(c.id)) selectedCards.delete(c.id);
        else selectedCards.add(c.id);
        updateBulkUI(); renderGrid();
      }, 220);
    };
    div.ondragstart = (e) => { e.dataTransfer.setData('card-id', c.id); div.classList.add('dragging'); };
    div.ondragend = () => div.classList.remove('dragging');
    div.ondragover = (e) => e.preventDefault();
    div.ondrop = (e) => handleSortDrop(e, c.id);
    grid.appendChild(div);
  });
  initLazyImages();
}

function initLazyImages() {
  const imgs = document.querySelectorAll('img.lazy-img');
  if (!imgs.length) return;
  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        img.src = img.dataset.src;
        img.classList.remove('lazy-img');
        obs.unobserve(img);
      }
    });
  }, { rootMargin: '100px' });
  imgs.forEach(img => observer.observe(img));
}

function _toggleMissingFilter() {
  showOnlyMissing = !showOnlyMissing;
  const btn = document.getElementById('btn-toggle-missing');
  if(showOnlyMissing) {
      btn.classList.add('active');
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> Alle Anzeigen`;
  } else {
      btn.classList.remove('active');
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg> Nur Fehlende`;
  }
  renderGrid();
}

// ── DRAG & DROP LOGIK KARTEN ──────────────────────────────────
window.addEventListener('dragover', e => e.preventDefault());

function processImageFile(file) {
  return new Promise((resolve) => {
    const rd = new FileReader();
    rd.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 400;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h *= MAX / w; w = MAX; }
          else { w *= MAX / h; h = MAX; }
        }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/webp', 0.65));
      };
      img.src = ev.target.result;
    };
    rd.readAsDataURL(file);
  });
}

window.addEventListener('drop', async e => {
  if (e.target.closest('#login-screen')) return;
  if (e.dataTransfer.getData('card-id')) return;
  if (e.target.closest('.cat-list')) return; 
  e.preventDefault();
  
  const files = Array.from(e.dataTransfer.files);
  const html = e.dataTransfer.getData('text/html');
  let newUrls =[];

  if (files.length > 0) {
    for (let file of files) {
      if (file.type.startsWith('image/')) {
        const base64 = await processImageFile(file);
        newUrls.push(base64);
      }
    }
  } else if (html) {
    const parser = new DOMParser();
    const docParsed = parser.parseFromString(html, "text/html");
    const imgs = Array.from(docParsed.querySelectorAll('img'));
    newUrls = imgs.map(img => img.src).filter(src => src);
  }

  if (newUrls.length > 0) {
    const batch = writeBatch(db);
    newUrls.forEach((url, i) => {
      const id = uid();
      batch.set(doc(db, 'cards', id), { id, image: url, status: 'have', cat: activeCat, name: '', pos: Date.now() + i });
    });
    await batch.commit();
  }
});

async function handleSortDrop(e, targetId) {
  e.preventDefault();
  const draggedId = e.dataTransfer.getData('card-id');
  if (!draggedId || draggedId === targetId) return;
  const tIdx = cards.findIndex(c => c.id === targetId);
  await updateDoc(doc(db, 'cards', draggedId), { pos: cards[tIdx].pos - 0.1 });
}

// ── SELECTION & BULK ──────────────────────────────────────────
window.addEventListener('mousedown', e => {
  if (e.target.closest('#login-screen')) return;
  if (e.target.closest('.toolbar, .sidebar, .overlay, .card-item, #bulk-bar')) return;
  isSelecting = true;
  startX = e.pageX; startY = e.pageY;
  selectedCards.clear();
  const sb = document.getElementById('selection-box');
  sb.style.display = 'block'; sb.style.width = '0px'; sb.style.height = '0px';
  updateBulkUI(); renderGrid();
});

window.addEventListener('mousemove', e => {
  if (!isSelecting) return;
  const sb = document.getElementById('selection-box');
  const x = Math.min(e.pageX, startX), y = Math.min(e.pageY, startY);
  const w = Math.abs(e.pageX - startX), h = Math.abs(e.pageY - startY);
  sb.style.left = x+'px'; sb.style.top = y+'px'; sb.style.width = w+'px'; sb.style.height = h+'px';
  const rect = sb.getBoundingClientRect();
  document.querySelectorAll('.card-item').forEach(el => {
    const r = el.getBoundingClientRect();
    const isOver = !(r.right < rect.left || r.left > rect.right || r.bottom < rect.top || r.top > rect.bottom);
    if(isOver) selectedCards.add(el.dataset.id); else selectedCards.delete(el.dataset.id);
  });
  updateBulkUI();
});

window.addEventListener('mouseup', () => { if(isSelecting) { isSelecting = false; document.getElementById('selection-box').style.display = 'none'; renderGrid(); } });

function updateBulkUI() {
  const bar = document.getElementById('bulk-bar');
  if (selectedCards.size > 0) {
    bar.classList.add('visible');
    document.getElementById('bulk-count').textContent = `${selectedCards.size} markiert`;
  } else { bar.classList.remove('visible'); }
}

async function _bulkStatus(status) {
  const batch = writeBatch(db);
  selectedCards.forEach(id => batch.update(doc(db, 'cards', id), { status }));
  await batch.commit();
  selectedCards.clear(); updateBulkUI(); renderGrid();
}

async function _bulkDelete() {
  if (!confirm('Markierte Karten löschen?')) return;
  const batch = writeBatch(db);
  selectedCards.forEach(id => batch.delete(doc(db, 'cards', id)));
  await batch.commit();
  selectedCards.clear(); updateBulkUI(); renderGrid();
}

function _openEditModal(card) {
  editingId = card.id;
  document.getElementById('f-name').value = card.name || '';
  document.getElementById('f-set').value = card.set || '';
  document.getElementById('f-cat').value = card.cat || '';
  document.getElementById('f-status').value = card.status || 'have';
  document.getElementById('modal-overlay').classList.add('open');
};

async function _saveCard() {
  await updateDoc(doc(db, 'cards', editingId), {
    name: document.getElementById('f-name').value, set: document.getElementById('f-set').value,
    cat: document.getElementById('f-cat').value, status: document.getElementById('f-status').value
  });
  document.getElementById('modal-overlay').classList.remove('open');
};

function _setCols(c) {
  const g = document.getElementById('card-grid');
  g.style.gridTemplateColumns = (c === 'auto') ? 'repeat(auto-fill, minmax(160px, 1fr))' : `repeat(${c}, 1fr)`;
}
</script>

<style>

/* ── LOGIN ───────────────────────────────────────────────────── */

}

.login-card input {

.login-card input:focus {

}

#login-error { color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; height: 1rem; font-weight: 500; }

/* ── APP LAYOUT ──────────────────────────────────────────────── */
#app { display: none; grid-template-rows: 64px 64px 1fr; height: 100vh; }

header {

}

.logo {

}

.fb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.3s; }

.logout-btn {

}
.logout-btn:hover { background: var(--border); }

.stat-pill {

}
.stat-pill b { font-family: 'Outfit', sans-serif; font-size: 0.9rem; color: var(--text); }
.stat-pill b.owned { color: var(--gold); }

/* ── TOOLBAR ─────────────────────────────────────────────────── */
.toolbar { 
    background: var(--bg); 
    border-bottom: 1px solid var(--border); 
    display: flex; 
    align-items: center; 
    padding: 0 2rem;

}

.toolbar input, .toolbar select {

    color: var(--text); 
    padding: 10px 16px; 
    border-radius: 10px;

    transition: all 0.2s;
}
.toolbar input:focus, .toolbar select:focus { border-color: var(--gold); }
.toolbar input { min-width: 250px; }

.btn-toggle {
    background: var(--surf);
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;

}
.btn-toggle:hover { color: var(--text); background: var(--surf-light); }
.btn-toggle.active {

.btn-gold {

}
.btn-gold:hover { opacity: 0.9; }
.btn-gold:active { transform: scale(0.98); }

/* ── SIDEBAR & CATEGORIES ────────────────────────────────────── */

.sidebar {

}

.cat-list { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 4px; }

.cat-wrapper { display: flex; flex-direction: column; }

}
.sub-cat-wrapper.collapsed { grid-template-rows: 0fr; }

/* Die Drop-Zone für Unterkategorien hat nun einen min-height Puffer, damit leere gut treffbar sind */
.sub-cat-list { 
    display: flex; flex-direction: column; 
    min-height: 12px; 
    padding-top: 4px; padding-bottom: 6px; 
}

.cat-content { 
    padding: 12px 14px; 
    border: 1px solid transparent; 
    border-radius: 10px;

    position: relative;

    display: flex;

.cat-content:hover { background: rgba(255, 255, 255, 0.03); }
.cat-content.active {

}
.cat-content.sub-cat { margin-left: 24px; padding: 10px 14px; }

/* Sortier-Styling */
.sortable-ghost > .cat-content { 
    opacity: 0.5; 
    background: rgba(234, 179, 8, 0.05); 
    border: 1px dashed var(--gold); 
}
.sortable-drag > .cat-content { 
    cursor: grabbing !important; 
    background: var(--surf-light);

    border-color: var(--gold);
}

.cat-drag-handle {

    cursor: grab;
    margin-right: 4px;
}
.cat-content:hover .cat-drag-handle { opacity: 0.5; }
.cat-drag-handle:hover { opacity: 1 !important; color: var(--text); }
.cat-drag-handle:active { cursor: grabbing; }
.cat-drag-handle svg { width: 14px; height: 14px; pointer-events: none; }

.toggle-icon { 
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    margin-right: 6px;
    border-radius: 4px;
    transition: background 0.2s;
}
.toggle-icon:not(.empty):hover { background: var(--surf-light); color: var(--text); }
.toggle-icon.empty { pointer-events: none; } /* Platzhalter für leere Kategorien */
.toggle-icon svg { width: 14px; height: 14px; transition: transform 0.3s; pointer-events: none; }
.toggle-icon.rotated svg { transform: rotate(-90deg); }

.cat-label { 
    font-weight: 500; 
    font-size: 0.95rem; 
    flex: 1;
    pointer-events: none; 
    z-index: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.cat-stats { 
    font-size: 0.75rem; 
    color: var(--text-muted); 
    z-index: 1; 
    pointer-events: none;

}
.cat-stats .pct { color: var(--gold); font-weight: 600; margin-left: 4px; }

.per-bg {

.cat-actions {

.cat-action {

.cat-action svg { width: 14px; height: 14px; pointer-events: none; }
.cat-action:hover { background: var(--surf-light); color: var(--text); }

.grid-container { flex: 1; padding: 2.5rem; overflow-y: auto; position: relative; background: var(--bg); }

.card-item {

    border: 1px solid var(--border);

    overflow: hidden; 
    position: relative; 
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s;

.card-img-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; background: #111; }

/* ── BULK & SELECTION ────────────────────────────────────────── */
#selection-box { position: absolute; background: rgba(234, 179, 8, 0.15); border: 1px solid var(--gold); border-radius: 4px; pointer-events: none; display: none; z-index: 1000; }

#bulk-bar { 
    position: fixed; 
    bottom: 40px; 
    left: 50%; 
    transform: translateX(-50%) translateY(100px);

#bulk-bar.visible { transform: translateX(-50%) translateY(0); }

#bulk-count { color: var(--gold); font-family: 'Outfit', sans-serif; font-weight: 600; padding: 0 10px; }

.bulk-btn { 
    border: none; background: var(--surf-light); color: var(--text); 
    padding: 8px 16px; border-radius: 100px; cursor: pointer; font-size: 0.8rem; font-weight: 600;

}
.bulk-btn:hover { background: var(--text); color: var(--bg); }

/* ── MODALS ──────────────────────────────────────────────────── */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 5000; align-items: center; justify-content: center; }
.overlay.open { display: flex; animation: fadeIn 0.2s ease; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal { 
    background: var(--surf); border: 1px solid var(--border); padding: 2.5rem;

.modal h3 { font-family: 'Outfit', sans-serif; color: var(--text); text-align: center; margin-bottom: 1rem; font-size: 1.5rem; letter-spacing: -0.5px; }

/* ── SCROLLBARS ──────────────────────────────────────────────── */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>
